<style>
/* Layout: barra lateral con Inicio y la lista de LLC; Inicio = tablero del cierre mensual por estado; ficha de LLC = histórico de meses + detalle del mes */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface2:#f8faf9; --ink:#15211d; --muted:#5d6b66; --line:#dbe2df;
  --nav:#0f2a24; --nav-ink:#cfe1da; --accent:#1a8f4e; --accent-ink:#ffffff; --accent-soft:#e0f3e7;
  --ok:#2563c9; --ok-soft:#dde8fb; --done:#1f8a57; --done-soft:#dff3e8; --warn:#a86b00; --warn-soft:#fcefd2; --bad:#b83a3a; --bad-soft:#f8dfdf;
  --display:"Manrope",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --surface2:#1b2421; --ink:#e3ebe8; --muted:#94a39e; --line:#2a3531;
  --nav:#0a1210; --nav-ink:#b9cdc6; --accent:#2bd06a; --accent-ink:#06210f; --accent-soft:#163b25;
  --ok:#7fb2ff; --ok-soft:#1a2a45; --done:#5fd09a; --done-soft:#173426; --warn:#e7b44a; --warn-soft:#3a2e12; --bad:#ef8080; --bad-soft:#3d1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --surface2:#1b2421; --ink:#e3ebe8; --muted:#94a39e; --line:#2a3531;
  --nav:#0a1210; --nav-ink:#b9cdc6; --accent:#2bd06a; --accent-ink:#06210f; --accent-soft:#163b25;
  --ok:#7fb2ff; --ok-soft:#1a2a45; --done:#5fd09a; --done-soft:#173426; --warn:#e7b44a; --warn-soft:#3a2e12; --bad:#ef8080; --bad-soft:#3d1c1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100%}
.nav{width:228px;flex:none;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;gap:4px;padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:19px;color:#fff;padding:0 8px 2px}
.brand small{display:block;font:500 10px var(--body);color:var(--nav-ink);opacity:.8;letter-spacing:.06em;text-transform:uppercase;margin-top:3px;white-space:nowrap}
.brand .txt{display:flex;flex-direction:column;justify-content:center}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,#2bd06a,#17895a);display:grid;place-items:center;color:#06210f;font:700 11px var(--mono);flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand .bt{font:800 20px var(--display);color:#fff;line-height:1.1;white-space:nowrap}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:14px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="true"]{background:rgba(31,168,85,.22);color:#fff;box-shadow:inset 3px 0 0 #2bd06a}
.nav .badge{background:#f08a24;color:#241000;font-weight:700}
.flag{font:800 11px var(--body);width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;flex:none;line-height:1}
.f-bad{color:#ef8080;border:1.5px solid #ef8080}.f-warn{color:#e7b44a;border:1.5px solid #e7b44a}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font:600 11px var(--mono);background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px}
.nav .demo{margin-top:auto;font-size:12px;opacity:.75;padding:8px}
@media (min-width:761px){.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:100vh;height:100dvh;overflow-y:auto}}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;padding:12px 10px 4px}
.nav .llc{font-weight:400}
.nav .llc .dot{box-shadow:0 0 0 2px rgba(255,255,255,.08)}
tr.sel td{background:var(--accent-soft)}
.clist{margin:0;padding:4px 4px 4px 20px;display:flex;flex-direction:column;gap:10px}
.clist li{line-height:1.45}
.old{color:var(--bad);font-weight:600}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.mbtn{all:unset;cursor:pointer;font-weight:600}.mbtn:hover{text-decoration:underline}.mbtn:focus-visible{outline:2px solid var(--accent)}
.main{flex:1;min-width:0;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:none;width:100%;margin:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:15px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(145deg,#2bd06a,#17895a);border-color:#1fa85f;color:#06210f;font-weight:600}
.btn.primary:hover{border-color:#2bd06a;filter:brightness(1.05)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font:600 22px var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}
.card{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent)}
.card b{display:block}
.card span{color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--done-soft);color:var(--done)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-neu{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.alert{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.alertrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.alertrow .alert{width:fit-content;max-width:100%}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--fg,inherit);cursor:pointer;text-align:left}.lnk:hover{text-decoration:underline}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}.pos{color:var(--done)}
.p-soc{background:var(--ok-soft);color:var(--ok)}
tr.rev td{background:var(--warn-soft)}
select.cls{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;max-width:220px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:2px solid transparent;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
@media (max-width:600px){.months{grid-template-columns:repeat(6,minmax(0,1fr))}}
.m{text-align:center;font-size:11px;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.m.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.m.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.m.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.form{border:2px solid var(--ink);border-radius:4px;background:var(--surface)}
.form-h{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.form-h>div{padding:8px 10px}
.form-h .fno{border-right:1px solid var(--ink);font:800 22px var(--display);min-width:110px}
.form-h .fno small{display:block;font:500 10px var(--body)}
.form-h .ft{flex:1;min-width:200px;font-weight:600}
.fs{background:var(--ink);color:var(--surface);font-weight:600;font-size:12.5px;padding:5px 10px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));border-bottom:1px solid var(--line)}
.fc{padding:6px 10px;border-right:1px solid var(--line);min-width:0}
.fc:last-child{border-right:0}
.fc .l{font-size:11.5px;color:var(--muted)}
.fc .l b{color:var(--ink);margin-right:4px}
.fc .val{font:500 13.5px var(--mono);color:var(--accent);word-break:break-word}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.ico{font:700 12px var(--mono);width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.ico.y{background:var(--ok-soft);color:var(--ok)}.ico.n{background:var(--bad-soft);color:var(--bad)}
.search{width:100%;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.ins{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ins summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.ins summary::-webkit-details-marker{display:none}
.ins[open] summary{border-bottom:1px solid var(--line)}
.ins .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-width:78ch}
.ins .body p{margin:0}
.src{font-size:12px;color:var(--muted);margin:0}
textarea.msg{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface2);font-size:13px}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(520px,calc(100vw - 32px));background:var(--nav);color:#fff;border:1px solid rgba(43,208,106,.45);box-shadow:0 12px 40px rgba(0,0,0,.45);padding:14px 20px;border-radius:12px;font-weight:500;text-align:center;z-index:20}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.cur{margin-right:.1em}
@media (max-width:760px){
  .app{flex-direction:column}
  .nav{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
  .nav hr,.nav .demo{display:none}
  .brand{width:100%;padding-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const OCT_STATE={suarez:"warn",ferrer:"ok",ibanez:"bad",ortega:"ok",gil:"warn",ramos:"bad"};

function genMovs(c,idx){
  const r=seedRand(idx*97+13); const out=[]; let id=1;
  const startMonth = c.constit.endsWith(String(YEAR)) ? parseInt(c.constit.split("/")[1])-1 : 0;
  for(let m=startMonth;m<=CLOSING;m++){
    if(m===CLOSING && OCT_STATE[c.id]==="bad") continue;
    const d=n=>String(n).padStart(2,"0")+"/"+String(m+1).padStart(2,"0")+"/"+YEAR;
    const n=2+Math.floor(r()*2);
    for(let k=0;k<n;k++){ const a=Math.round(c.ingreso[0]/n+r()*(c.ingreso[1]-c.ingreso[0])/n); out.push({id:id++,m,fecha:d(3+k*9),concepto:c.ventas,importe:a,cat:"ingreso"}); }
    out.push({id:id++,m,fecha:d(5),concepto:"Shopify subscription",importe:-39,cat:"gasto"});
    if(r()>.4) out.push({id:id++,m,fecha:d(11),concepto:"Google Ads",importe:-Math.round(80+r()*220),cat:"gasto"});
    if(r()>.5) out.push({id:id++,m,fecha:d(14),concepto:"Adobe Creative Cloud",importe:-62,cat:"gasto"});
    if(m%2===1) out.push({id:id++,m,fecha:d(20),concepto:"Transfer to "+c.socio.toUpperCase()+" (Wise)",importe:-Math.round(1800+r()*2200),cat:"retir"});
  }
  if(startMonth===0) out.unshift({id:id++,m:0,fecha:"02/01/"+YEAR,concepto:"Incoming transfer "+c.socio.toUpperCase(),importe:2000,cat:"aport"});
  else out.unshift({id:id++,m:startMonth,fecha:"25/"+String(startMonth+1).padStart(2,"0")+"/"+YEAR,concepto:"Initial deposit "+c.socio.toUpperCase(),importe:1500,cat:"aport"});
  if(OCT_STATE[c.id]==="warn"){
    out.push({id:id++,m:CLOSING,fecha:"08/10/"+YEAR,concepto:"Transfer "+c.socio.split(" ")[0].toUpperCase()+" "+c.socio.split(" ").slice(-1)[0].toUpperCase(),importe:-2500,cat:"revisar",nota:"¿Retirada de beneficios o devolución de un préstamo?"});
    out.push({id:id++,m:CLOSING,fecha:"21/10/"+YEAR,concepto:"ZARA.COM ES",importe:-86,cat:"revisar",nota:"¿Gasto personal pagado con la tarjeta de la LLC?"});
  }
  if(c.id==="suarez") out.push({id:id++,m:5,fecha:"17/06/"+YEAR,concepto:"Incoming transfer C A SUAREZ",importe:3000,cat:"revisar",nota:"¿Aportación de capital o préstamo del socio a la LLC?"});
  if(c.id==="gil"){ for(let m=startMonth;m<=CLOSING;m++){ if(m===CLOSING) continue; out.push({id:id++,m,fecha:"09/"+String(m+1).padStart(2,"0")+"/"+YEAR,concepto:"Transfer to GIL NUTRICION SL - product invoice",importe:-Math.round(900+r()*600),cat:"compra_vinc"}); }
    out.push({id:id++,m:CLOSING,fecha:"12/10/"+YEAR,concepto:"Transfer to GN SL ref 2026-118",importe:-1340,cat:"revisar",nota:"La IA lo relaciona con Gil Nutrición SL (empresa del socio): ¿compra de producto? Va a un 5472 separado",pregunta:"¿Es el pago de una factura de producto de Gil Nutrición SL?"}); }
  if(c.id==="ramos"){ for(let m=startMonth;m<CLOSING;m++) out.push({id:id++,m,fecha:"28/"+String(m+1).padStart(2,"0")+"/"+YEAR,concepto:"RAMOS TECH SL software license fee",importe:-350,cat:"canon_vinc"}); }
  if(c.id==="ortega"){ for(let m=5;m<=CLOSING;m++) out.push({id:id++,m,fecha:"30/"+String(m+1).padStart(2,"0")+"/"+YEAR,concepto:"Interest to PABLO ORTEGA - prestamo",importe:m<8?-25:-15,cat:"int_socio"}); out.push({id:id++,m:4,fecha:"15/05/"+YEAR,concepto:"Incoming transfer PABLO ORTEGA - prestamo",importe:5000,cat:"prest_rec"}); out.push({id:id++,m:8,fecha:"22/09/"+YEAR,concepto:"Transfer to PABLO ORTEGA - devolucion prestamo",importe:-2000,cat:"dev_prest"}); }
  return out.sort((a,b)=>a.m-b.m||a.fecha.localeCompare(b.fecha));
}

const $=s=>document.querySelector(s);
const num=n=>String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,",");

const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200);}
function pend(c){return c.movs.filter(x=>x.cat==="revisar");}
function startM(c){ return c.constit.endsWith(String(YEAR)) ? parseInt(c.constit.split("/")[1])-1 : 0; }
function missing(c){ const out=[]; for(let m=startM(c);m<=CLOSING;m++){ if(!c.movs.some(x=>x.m===m)&&!(c.ext&&c.ext[m])) out.push(m); } return out; }
function octState(c){ if(missing(c).length) return "bad"; if(pend(c).length) return "warn"; for(let m=startM(c);m<=CLOSING;m++){ if(!c.cerrados[m]) return "warn"; } return "ok"; }
function sumCat(c,cat){return c.movs.filter(x=>x.cat===cat).reduce((s,x)=>s+x.importe,0);}
function totals(c){
  const ing=sumCat(c,"ingreso"), gas=sumCat(c,"gasto");
  const aport=sumCat(c,"aport")+Math.abs(sumCat(c,"llc_socio"));
  const retir=Math.abs(sumCat(c,"retir"))+Math.abs(sumCat(c,"pers_llc"));
  const prestRec=Math.max(0,sumCat(c,"prest_rec")+sumCat(c,"dev_prest")), prestDado=Math.abs(sumCat(c,"prest_dado"));
  const saldo=c.movs.reduce((s,x)=>s+x.importe,0)+ (c.saldoInicial||0);
  return {ing,gas,aport,retir,prestRec,prestDado,saldo:Math.max(0,saldo)};
}

function importPdf(c,m,fname){ const today=new Date().toLocaleDateString("es-ES"); c.ext=c.ext||{}; c.ext[m]={archivo:fname,recibido:today}; c.cerrados[m]=false;
      let added=0, rv=0;
      if(/demo/i.test(fname)&&!c.movs.some(x=>x.m===m)){ let next=Math.max(0,...c.movs.map(x=>x.id))+1; const d=n=>String(n).padStart(2,"0")+"/"+String(m+1).padStart(2,"0")+"/"+YEAR;
        const first=c.socio.split(" ")[0].toUpperCase(), full=c.socio.toUpperCase(), last=c.socio.split(" ").slice(-1)[0].normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
        const DEMO=[[2,c.ventas,1240],[5,"Canva Pro subscription",-12.99],[9,c.ventas,980],[11,"Google Ads",-145],[14,"Transfer to "+full+" (Wise)",-2000],
          [17,"AMAZON.ES MARKETPLACE",-64.90,"¿Compra personal pagada con la tarjeta de la LLC?","¿La compra de Amazon del 17/10 fue personal o para el negocio?"],
          [20,"Incoming transfer "+first+" "+last,1500,"¿Aportación de capital o préstamo "+(c.g==="f"?"de la socia":"del socio")+" a la LLC?","¿La transferencia de 1.500 $ del 20/10 es una aportación o un préstamo que la LLC te devolverá?"],
          [23,c.ventas,1310],
          [27,"Transfer to "+last+" FORMACION SL - diseño curso",-800,"Sociedad con el apellido "+(c.g==="f"?"de la socia":"del socio")+": ¿empresa vinculada? Si lo es, va en un 5472 aparte","¿"+last.charAt(0)+last.slice(1).toLowerCase()+" Formación SL es una sociedad tuya? ¿Qué servicio os prestó?"]];
        DEMO.forEach(([dd,co,im,nota,preg])=>{let cat;if(nota)cat="revisar";else{const prev=c.movs.find(x=>x.concepto.trim().toLowerCase()===co.toLowerCase()&&x.cat!=="revisar");cat=prev?prev.cat:autoClass(co,im);}
          const mv={id:next++,m,fecha:d(dd),concepto:co,importe:im,cat};if(cat==="revisar"){mv.nota=nota||"Sin clasificar";if(preg)mv.pregunta=preg;rv++;}c.movs.push(mv);added++;});
        c.movs.sort((a,b)=>a.m-b.m||a.fecha.localeCompare(b.fecha)); }
      else if(!c.movs.some(x=>x.m===m)){ let next=Math.max(0,...c.movs.map(x=>x.id))+1; const d=n=>String(n).padStart(2,"0")+"/"+String(m+1).padStart(2,"0")+"/"+YEAR; const r=seedRand(m*31+next);
        const sim=[[d(4),c.ventas,Math.round(c.ingreso[0]*0.6+r()*800)],[d(15),c.ventas,Math.round(c.ingreso[0]*0.5+r()*700)],[d(6),"Shopify subscription",-39],[d(19),"Transfer "+c.socio.toUpperCase(),-1200]];
        sim.forEach(([fe,co,im])=>{const prev=c.movs.find(x=>x.concepto.trim().toLowerCase()===co.toLowerCase()&&x.cat!=="revisar"&&x.cat!=="retir");const cat=prev?prev.cat:autoClass(co,im);const mv={id:next++,m,fecha:fe,concepto:co,importe:im,cat};if(cat==="revisar"){mv.nota="¿Retirada de beneficios o devolución de un préstamo?";rv++;}c.movs.push(mv);added++;});
        c.movs.sort((a,b)=>a.m-b.m||a.fecha.localeCompare(b.fecha)); }
      if(rv) c.alerta={desde:today,semanas:1};
      save();return added?("PDF leído · la IA ha clasificado "+added+" movimientos y deja "+rv+" por revisar"):"PDF registrado como extracto de "+MESES_L[m];
}
function demoName(c,m){return "Extracto_DEMO_"+c.llc.replace(/\s+/g,"_").normalize("NFD").replace(/[\u0300-\u036f]/g,"")+"_"+YEAR+"-"+String(m+1).padStart(2,"0")+".pdf";}
function bind(){
  document.querySelectorAll("[data-nav-llc]").forEach(b=>b.addEventListener("click",()=>{MOVM=CLOSING;go("ficha",b.dataset.navLlc);}));
  document.querySelectorAll("#nav [data-view]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));
  const rm=$("#remind"); if(rm) rm.addEventListener("click",()=>{const today=new Date().toLocaleDateString("es-ES");let n=0;DATA.forEach(x=>{if(octState(x)!=="ok"){x.alerta={desde:today,semanas:1};n++;}});save();render();toast("Recordatorio enviado a "+n+" clientes (simulado)");});
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{TAB="mes";MOVM=CLOSING;EXTM=CLOSING;go("ficha",b.dataset.open);}));
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  const ea=$("#edit-auto"); if(ea) ea.addEventListener("click",()=>{const c0=DATA.find(x=>x.id===CUR);const auto=c0.movs.filter(x=>x.m===MOVM&&x.cat!=="revisar");const tb=ea.closest("details").querySelector("tbody");const optionList=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.t}</option>`).join("");tb.querySelectorAll("tr").forEach((tr,i)=>{const x=auto[i];tr.children[3].innerHTML=`<select class="cls" data-mov="${x.id}" aria-label="Clasificación">${optionList.replace(`value="${x.cat}"`,`value="${x.cat}" selected`)}</select>`;});tb.querySelectorAll("select.cls").forEach(s=>s.addEventListener("change",()=>{const m=c0.movs.find(x=>x.id==s.dataset.mov);m.cat=s.value;save();render();toast("Clasificado como «"+CATS[m.cat].t+"»");}));ea.hidden=true;});
  document.querySelectorAll("[data-movm]").forEach(b=>b.addEventListener("click",()=>{MOVM=+b.dataset.movm;render();const d=document.querySelector("#month-detail");if(d)d.scrollIntoView({behavior:"smooth",block:"start"});}));
  document.querySelectorAll("[data-extm]").forEach(b=>b.addEventListener("click",()=>{EXTM=+b.dataset.extm;render();}));
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.tab;render();}));
  const c=DATA.find(x=>x.id===CUR);
  document.querySelectorAll("select.cls").forEach(s=>s.addEventListener("change",()=>{const m=c.movs.find(x=>x.id==s.dataset.mov);m.cat=s.value;if(m.cat!=="revisar"){delete m.nota;delete m.pregunta;}save();render();toast("Clasificado como «"+CATS[m.cat].t+"»");}));
  const vp=$("#ver-pdf"); if(vp) vp.addEventListener("click",ev=>{ev.preventDefault();const bin=atob(DEMO_PDF);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([arr],{type:"application/pdf"}));window.open(url,"_blank");});
  const du=$("#demo-up"); if(du) du.addEventListener("click",()=>{du.disabled=true;du.textContent="Leyendo el PDF…";setTimeout(()=>{const msg=importPdf(c,MOVM,demoName(c,MOVM));render();toast(msg);const d=$("#month-detail");if(d)d.scrollIntoView({behavior:"smooth",block:"start"});},900);});
  const rs=$("#reset-demo"); if(rs) rs.addEventListener("click",()=>{DATA=freshData();save();VIEW="cierre";render();toast("Datos de ejemplo restablecidos");});
  const cm=$("#copy-msg"); if(cm) cm.addEventListener("click",()=>copy($("#msg").value));
  const cl=$("#close-month"); if(cl) cl.addEventListener("click",()=>{c.cerrados[MOVM]=true;if(MOVM===CLOSING)c.alerta=null;save();render();toast(MESES_L[MOVM][0].toUpperCase()+MESES_L[MOVM].slice(1)+" cerrado");});
  const cf=$("#conf"); if(cf) cf.addEventListener("click",()=>{c.conformidad=!c.conformidad;save();render();});
  const c5=$("#copy-5472"); if(c5) c5.addEventListener("click",()=>{const t=totals(c);copy(`Form 5472 ${YEAR} · ${c.llc} (EIN ${c.ein})\nTotal activos: ${fmtT(t.saldo)}\nAportaciones del socio: ${fmtT(t.aport)}\nRetiradas al socio: ${fmtT(t.retir)}\nPréstamos recibidos: ${fmtT(t.prestRec)} · concedidos: ${fmtT(t.prestDado)}\nSocio: ${c.socio} · NIF ${c.nif} · Ref. ${c.ref}`);});
  [["#csv",()=>MOVM],["#csv-ext",()=>EXTM]].forEach(([sel,gm])=>{const csv=$(sel); if(csv) csv.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
    if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){ const msg=importPdf(c,gm(),f.name); render(); toast(msg); return; }const rd=new FileReader();rd.onload=()=>{let n=0,r=0;let next=Math.max(0,...c.movs.map(x=>x.id))+1;const startId=next;
    rd.result.split(/\r?\n/).forEach(line=>{const p=line.split(/[;,\t]/);if(p.length<3)return;const imp=parseFloat(p[2].replace(/\./g,"").replace(",","."));if(isNaN(imp))return;const m=gm();const prev=c.movs.find(x=>x.concepto.trim().toLowerCase()===p[1].trim().toLowerCase()&&x.cat!=="revisar");const cat=prev?prev.cat:autoClass(p[1],imp);if(cat==="revisar")r++;n++;c.cerrados[m]=false;c.movs.push({id:next++,m,fecha:p[0].trim(),concepto:p[1].trim(),importe:imp,cat});});
    c.ext=c.ext||{};c.movs.filter(x=>x.id>=startId).forEach(x=>{c.ext[x.m]={archivo:f.name,recibido:new Date().toLocaleDateString("es-ES")};});if(r) c.alerta={desde:new Date().toLocaleDateString("es-ES"),semanas:1};save();render();toast(n+" movimientos importados · "+r+" a revisar");};rd.readAsText(f);});});
  const q=$("#q"); if(q) q.addEventListener("input",()=>{const s=q.value.toLowerCase();document.querySelectorAll(".ins[data-i]").forEach(d=>{const x=INSTR[d.dataset.i];const hit=!s||(x.t+" "+x.b.join(" ")).toLowerCase().includes(s);d.hidden=!hit;if(s&&hit)d.open=true;});});
}
render();
})();
</script>
